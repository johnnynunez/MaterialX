name: Pinned MaterialX CP312 native Windows ARM64
on:
  push:
    branches: [ci/cp312-win-arm64-pinned]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/MaterialX
          ref: 7b64921ef1d42f2d57871e9d2c43dc11f041f26b
          path: source
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git -C source rev-parse HEAD) -ne '7b64921ef1d42f2d57871e9d2c43dc11f041f26b') { throw 'wrong source' }
      - name: Isolated artifact and cache root
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/evidence"
          New-Item -ItemType Directory -Force $stage | Out-Null
          "STAGE=$stage" >> $env:GITHUB_ENV
          "PIP_CACHE_DIR=$env:RUNNER_TEMP/pip-cache" >> $env:GITHUB_ENV
          "VIRTUALENV_OVERRIDE_APP_DATA=$env:RUNNER_TEMP/virtualenv" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Check native interpreter
        run: python -c "import sys,sysconfig; print(sys.version, sysconfig.get_platform()); assert sysconfig.get_platform() == 'win-arm64'; assert sys.version_info[:2] == (3,12)"
      - name: Install declared documentation build tool
        uses: ssciwr/doxygen-install@f13be1686235deee0aeb6cdf56640170691dc96b
      - name: Build unmodified pinned source wheel
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: |
          python -m pip install pip==25.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip wheel ./source --no-deps -v --wheel-dir "$env:STAGE" *> "$env:STAGE/build.log"
          $code = $LASTEXITCODE
          Get-Content "$env:STAGE/build.log" -Tail 100
          exit $code
      - name: Audit all PE payloads and RECORD
        run: python harness/native-ci/wheel_audit.py "$env:STAGE"
      - name: Install wheel and test CPU APIs
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "$env:STAGE/*.whl").FullName
          python -m pip install $wheel pytest==8.4.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip freeze > "$env:STAGE/installed.txt"
          python -m pytest harness/native-ci/test_materialx_native.py -v --junitxml="$env:STAGE/native.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest source/python/MaterialXTest/main.py source/python/MaterialXTest/genshader.py --import-mode=importlib -v --junitxml="$env:STAGE/upstream.xml"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: materialx-1.39.5-cp312-win-arm64
          path: ${{ env.STAGE }}
          if-no-files-found: error
