name: main

on:
  push:
    branches: ['verify/windows-arm64-wheels']
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:

  sdist:
    name: Python SDist
    runs-on: ubuntu-24.04
    outputs:
      sdist_filename: ${{ steps.generate.outputs.filename }}

    steps:
    - name: Sync Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: 3.11

    - name: Build SDist
      id: generate
      run: |
        python -m pip install build
        python -m build -s . --outdir dist
        echo "filename=$(ls dist)" >> "$GITHUB_OUTPUT"

    - name: Upload SDist
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: MaterialX_Python_SDist
        path: dist/*.tar.gz

  wheels:
    name: Python Wheels
    runs-on: ${{ matrix.os }}
    needs: ['sdist']
    strategy:
      fail-fast: false
      matrix:
        python-minor: ['9', '10', '11', '12', '13', '14']
        os: ['windows-11-arm']
        exclude:
          # Python 3.9 and 3.10 are not available for Windows ARM64 in actions/setup-python.
          - os: 'windows-11-arm'
            python-minor: '9'
          - os: 'windows-11-arm'
            python-minor: '10'

    steps:
    - name: Sync Repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Install Python 3.${{ matrix.python-minor }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: 3.${{ matrix.python-minor }}

    - name: Download Sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: MaterialX_Python_SDist
        path: sdist

    - name: Install Doxygen (Windows)
      uses: ssciwr/doxygen-install@f13be1686235deee0aeb6cdf56640170691dc96b # v1
      if: runner.os == 'Windows'

    - name: Build Wheel
      uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a # v3.4.0
      with:
        package-dir: ${{ github.workspace }}/sdist/${{ needs.sdist.outputs.sdist_filename }}
      env:
        CIBW_BUILD: 'cp3${{ matrix.python-minor }}-*'
        CIBW_SKIP: '*musllinux*'
        CIBW_ARCHS: 'auto64'
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_BEFORE_ALL_LINUX: dnf install -y libXt-devel doxygen
        CIBW_BEFORE_ALL_MACOS: brew install doxygen
        CIBW_BUILD_VERBOSITY: 1
        CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=2
        MACOSX_DEPLOYMENT_TARGET: '11.0'

    - name: Install Wheel
      run: python -m pip install MaterialX --find-links wheelhouse --no-index

    - name: Python Tests
      run: |
        python MaterialXTest/main.py
        python MaterialXTest/genshader.py
      working-directory: python

    - name: Upload Wheel
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
      with:
        name: MaterialX_Python_Wheel_${{ matrix.os == 'windows-11-arm' && 'Windows_ARM64' || runner.os }}_3_${{ matrix.python-minor }}
        path: wheelhouse/*.whl
